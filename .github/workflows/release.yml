name: Release

# 推一个 v* tag 就把所有平台的产物一次发出去：
#
#   核心网关（无界面，纯 Go 静态二进制）   linux/macOS/Windows × amd64/arm64 + linux armv7   7 个包
#   桌面 App（Wails 壳）                   macOS arm64/amd64、Windows amd64、Linux amd64       4 个包
#   校验                                   SHA256SUMS
#
# 各平台原生产物在任何平台都无法完整产出（桌面壳要链接 GTK/WebKitGTK、要 codesign），
# 所以按平台分 job 跑，最后由 release job 汇总成一个 GitHub Release。
#
# 手工补发：workflow_dispatch 填 tag 名即可（tag 必须已经存在）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（例如 v0.2.0）'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: '1.26.1'
  XDG_RUNTIME_DIR: /tmp/runtime-root

jobs:
  # ------------------------------------------------------------------ 前置检查
  gate:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - id: v
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::tag '$TAG' 不是 vX.Y.Z 形式"
            exit 1
          fi
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "发布 $TAG（${TAG#v}）@ $(git rev-parse --short HEAD)"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: go test
        run: go test -count=1 ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web build & tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node --test src/lib.test.mjs
          node --test src/dialogs.test.mjs

  # ------------------------------------------------------------------ 核心网关（7 个平台）
  cli:
    name: cli ${{ matrix.target }}
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          GATEWAY_APP_VERSION="${{ needs.gate.outputs.version }}" npm run build

      # Linux 机时上交叉编译，产物与原生一致：网关是 CGO_ENABLED=0 的纯 Go。
      - name: Package
        env:
          SKIP_WEB: '1'
        run: bash scripts/release.sh package "${{ needs.gate.outputs.version }}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ strategy.job-index }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64

  # ------------------------------------------------------------------ 桌面 App：macOS
  # .app 里要放 web/dist、cloudflared、bun、cursor-bridge，全部在本 job 下载/安装后再打进包里，
  # 用户首次打开即可用，不需要自己装 Go/Node/brew。
  desktop-macos:
    name: desktop macos (arm64 + amd64)
    needs: gate
    # 两个架构合在一个 job 里顺序构建：分成两个 matrix job 会同时抢同一池，
    # 第二个经常排不到 runner 而在启动阶段被取消（steps=0）。串行只多花几分钟，
    # 但只占一个并发额度。
    #
    # runner 标签用 macos-latest 而不是固定 macos-14：实测 2026-11-10 起
    # macos-14 连续四次在启动瞬间被取消（steps=0、runner 为空），同一时间
    # macos-latest 上的 go test 跑得好好的。macos-latest 现在是 arm64，
    # amd64 那轮靠 Rosetta 编（下面的步骤已经会确保 Rosetta 在位）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # 先确认 Intel 运行时确实装了：Rosetta 缺失时 `arch -x86_64` 会在后面才炸。
      - name: Rosetta (Intel builds)
        run: |
          if ! /usr/bin/pgrep oahd >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: build, sign, package (两种架构)
        env:
          GATEWAY_APP_VERSION: ${{ needs.gate.outputs.version }}
          VERSION: ${{ needs.gate.outputs.version }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefix web
          mkdir -p dist
          for ARCH in arm64 amd64; do
            echo "===== $ARCH ====="
            ARCH="$ARCH" bash scripts/build-macos-app.sh

            APP="desktop/build/bin/LLM Protocol Gateway.app"
            test -x "$APP/Contents/MacOS/LLM Protocol Gateway"
            test -d "$APP/Contents/Resources/web-dist"
            test -x "$APP/Contents/Resources/bin/cloudflared"
            test -x "$APP/Contents/Resources/bin/bun"
            test -f "$APP/Contents/Resources/cursor-bridge/standalone.ts"
            # 控制台资源必须内嵌进可执行文件：用户常把 .app 单独拷走，
            # 只靠 Resources/web-dist 时窗口里会只剩 404。
            symbols="$(strings "$APP/Contents/MacOS/LLM Protocol Gateway")"
            grep -qF 'PlusJakartaSans-Variable.ttf' <<<"$symbols"
            codesign --verify --deep --strict "$APP" || codesign --force --deep --sign - "$APP"
            # 产物必须带本次版本号，否则控制台与 App 的升级判断会错位。
            # 先取回全文再匹配：`strings | grep -q` 在 pipefail 下会因为 grep 提前
            # 退出、strings 收到 SIGPIPE 而误判失败。
            symbols="$(strings "$APP/Contents/MacOS/LLM Protocol Gateway")"
            grep -qF "$VERSION" <<<"$symbols"
            plutil -lint "$APP/Contents/Info.plist"
            SHORT_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")"
            BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")"
            if [[ "$SHORT_VERSION" != "$VERSION" || "$BUNDLE_VERSION" != "$VERSION" ]]; then
              echo "::error::macOS App 的 Info.plist 版本不一致：期望 $VERSION，实际 $SHORT_VERSION/$BUNDLE_VERSION"
              exit 1
            fi
            build_info="$(go version -m "$APP/Contents/MacOS/LLM Protocol Gateway")"
            grep -qF -- "-X github.com/luca/llm-protocol-gateway/internal/gateway.BuildVersion=$VERSION" <<<"$build_info"
            grep -qF -- "-X github.com/luca/llm-protocol-gateway/desktop.version=$VERSION" <<<"$build_info"

            STAGE="$(mktemp -d)/llm-protocol-gateway-$VERSION"
            mkdir -p "$STAGE"
            ditto "$APP" "$STAGE/LLM Protocol Gateway.app"
            cp docs/macos-app.md "$STAGE/README.md"
            # 安装脚本只下载 macOS 包，相对本文件生成，免去维护第二份副本
            curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/scripts/install-macos.sh" \
              -o "$STAGE/install.sh"
            test -s "$STAGE/install.sh"
            chmod +x "$STAGE/install.sh"

            ditto -c -k --sequesterRsrc --keepParent "$STAGE" \
              "dist/llm-protocol-gateway-desktop-darwin-$ARCH.zip"
            ls -lh "dist/llm-protocol-gateway-desktop-darwin-$ARCH.zip"

            # dmg 是 macOS 用户的常规安装方式：挂载后把 App 拖进 Applications 即可。
            # /Applications 用软链表示，不占体积；README 一并放进去。
            DMG_ROOT="$(mktemp -d)/dmg"
            mkdir -p "$DMG_ROOT"
            ditto "$APP" "$DMG_ROOT/LLM Protocol Gateway.app"
            ln -s /Applications "$DMG_ROOT/Applications"
            cp docs/macos-app.md "$DMG_ROOT/README.md"
            hdiutil create -quiet -volname "LLM Protocol Gateway" -srcfolder "$DMG_ROOT" \
              -fs HFS+ -format UDZO -ov \
              "dist/llm-protocol-gateway-desktop-darwin-$ARCH.dmg"
            hdiutil verify -quiet "dist/llm-protocol-gateway-desktop-darwin-$ARCH.dmg"
            ls -lh "dist/llm-protocol-gateway-desktop-darwin-$ARCH.dmg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ 桌面 App：Windows
  # WebView2 不需要 cgo，直接交叉编译；图标/版本/DPI 清单由 go-winres 生成。
  desktop-windows:
    name: desktop windows/amd64
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build desktop exe
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefix web
          GATEWAY_APP_VERSION="${{ needs.gate.outputs.version }}" npm --prefix web run build
          bash scripts/release.sh desktop "${{ needs.gate.outputs.version }}" windows/amd64
          # 缺 desktop,production 标签时产物是个只会弹错误框的空壳，这里直接拦住。
          EXE="dist/llm-protocol-gateway-desktop-windows-amd64.exe"
          test -s "$EXE"
          if grep -aqF 'will not build without the correct build tags' "$EXE"; then
            echo "::error::桌面壳缺少 desktop,production 构建标签"
            exit 1
          fi
          # 单文件 exe 必须自带控制台资源，否则双击后窗口里只有 404 page not found。
          if ! grep -aqF 'PlusJakartaSans-Variable.ttf' "$EXE"; then
            echo "::error::exe 里没有内嵌 web/dist（检查 desktop_ui 构建标签与 bundle-desktop-assets.sh）"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/llm-protocol-gateway-desktop-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ 桌面 App：Linux
  # Wails 在 Linux 上通过 cgo 链接 GTK3 + WebKitGTK（webkit2_41），必须原生构建。
  desktop-linux:
    name: desktop linux/amd64
    needs: gate
    # 必须用 24.04：构建用的是 -tags webkit2_41，而 22.04 的软件源里只有
    # libwebkit2gtk-4.0-dev，tags 与库版本对不上会直接链接失败。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libegl1 \
            xvfb zlib1g-dev patchelf desktop-file-utils libfuse2 file

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build desktop binary
        env:
          GATEWAY_APP_VERSION: ${{ needs.gate.outputs.version }}
          # App.version 来自 build tag；-ldflags 末尾覆盖它，让控制台看到真实版本号
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          DESKTOP_LDFLAGS: -X github.com/luca/llm-protocol-gateway/internal/gateway.BuildVersion=${{ needs.gate.outputs.version }} -X github.com/luca/llm-protocol-gateway/desktop.version=${{ needs.gate.outputs.version }}
        run: |
          npm ci --no-audit --no-fund --prefix web
          GATEWAY_APP_VERSION="$GATEWAY_APP_VERSION" npm --prefix web run build
          node desktop/frontend/sync-dist.mjs
          bash scripts/bundle-desktop-assets.sh
          cd desktop
          # desktop_ui：把 web/dist 内嵌进二进制，AppImage/deb 被单独拷走也能打开控制台。
          wails build -tags "webkit2_41,desktop_ui" -ldflags "$DESKTOP_LDFLAGS ${UPDATE_PUBLIC_KEY:+-X github.com/luca/llm-protocol-gateway/internal/desktopupdate.SignaturePublicKey=$UPDATE_PUBLIC_KEY}"

      - name: Smoke test (headless X)
        run: |
          BIN="desktop/build/bin/LLM Protocol Gateway"
          if [ ! -x "$BIN" ]; then
            echo "wails 产物不在预期路径，实际："
            find desktop/build/bin -maxdepth 1
            exit 1
          fi
          file "$BIN"
          # 必须带上控制台资源：内嵌的 web/dist 缺了，窗口里只有 404。
          # 先取回全文再匹配，避免 grep 提前退出让 strings 收到 SIGPIPE（pipefail 下会误判）。
          symbols="$(strings "$BIN")"
          grep -qF 'PlusJakartaSans-Variable.ttf' <<<"$symbols"
          set +e
          xvfb-run -a "$BIN" >/tmp/desk.log 2>&1 &
          APP_PID=$!
          ui_ok=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/ui.html -w '%{http_code}' --max-time 2 http://127.0.0.1:18093/ || true)
            if [ "$code" = "200" ] && grep -qi '<!doctype html' /tmp/ui.html; then
              ui_ok=1
              break
            fi
            sleep 0.5
          done
          if [ "$ui_ok" != "1" ]; then
            echo "控制台首页没有返回 HTML（内嵌 web 资源缺失或网关没起来）"
            curl -sS -i --max-time 2 http://127.0.0.1:18093/ || true
            cat /tmp/desk.log || true
            kill "$APP_PID" 2>/dev/null
            exit 1
          fi
          # 窗口起不来时会立刻退出；再跑 5 秒还活着说明 GTK/WebKit 都加载成功。
          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "桌面壳启动后提前退出"
            cat /tmp/desk.log || true
            exit 1
          fi
          echo "桌面壳与内嵌控制台均正常"
          kill "$APP_PID" 2>/dev/null
          pkill -f "LLM Protocol Gateway" 2>/dev/null
          sleep 1
          cat /tmp/desk.log || true
          set -e

      - name: Package AppImage
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: bash scripts/package-desktop-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ 汇总发布
  publish:
    name: publish release
    needs: [gate, cli, desktop-macos, desktop-windows, desktop-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Release notes
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          # 手工补发时 workflow 从 main 跑、tag 由输入指定，所以不能拿 GITHUB_REF_NAME
          # 当前缀：那会算成 main^，变更日志错位。
          TAG="${{ inputs.tag || github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## 下载"
            echo
            echo "| 用途 | 文件 |"
            echo "| --- | --- |"
            echo "| macOS 桌面 App（Apple 芯片 / Intel） | \`llm-protocol-gateway-desktop-darwin-arm64.dmg\` / \`-amd64.dmg\`（挂载后拖进 Applications），另有 \`.zip\` 备用 |"
            echo "| Windows 桌面 App | \`llm-protocol-gateway-desktop-windows-amd64.exe\` |"
            echo "| Linux 桌面 App（AppImage / deb） | \`llm-protocol-gateway-desktop-linux-amd64.AppImage\` / \`.deb\` |"
            echo "| 无界面服务（Linux / macOS / Windows） | \`llm-protocol-gateway_${VERSION}_<系统>_<架构>.tar.gz\\|.zip\` |"
            echo "| 容器镜像 | \`yangyongyong/llm-protocol-gateway:${VERSION}\` / \`:latest\` |"
            echo
            echo "各安装包内都有 \`RUN.txt\`，写了解压/双击之后怎么启动、数据存在哪、可选依赖是什么。"
            echo "校验：\`sha256sum -c SHA256SUMS\`（macOS 用 \`shasum -a 256 -c\`）。"
            echo
            echo "## 未签名说明"
            echo
            echo "- macOS：ad-hoc 签名、未公证。首次打开请右键 →「打开」，或"
            echo "  \`xattr -dr com.apple.quarantine \"/Applications/LLM Protocol Gateway.app\"\`。"
            echo "- Windows：未做代码签名，SmartScreen 首次会拦：点「更多信息」→「仍要运行」。"
            echo
            echo "## 变更"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "$PREV..HEAD" | head -80
            else
              git log --no-merges --pretty='- %s' -n 40
            fi
            echo
            printf '<!-- lang:zh -->\n'
          } >notes.md
          cat notes.md

      - name: Update manifest and checksums
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "${UPDATE_PUBLIC_KEY:-}" ] && [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::UPDATE_PUBLIC_KEY is set, but UPDATE_SIGNING_KEY is missing; the app would reject this unsigned update"
            exit 1
          fi
          BUNDLED_PUBLIC_KEY="$(tr -d '[:space:]' < internal/desktopupdate/update_public_key.txt)"
          if [ -n "${UPDATE_PUBLIC_KEY:-}" ] && [ "$UPDATE_PUBLIC_KEY" != "$BUNDLED_PUBLIC_KEY" ]; then
            echo "::error::UPDATE_PUBLIC_KEY 与仓库内置公钥不一致；先轮换 internal/desktopupdate/update_public_key.txt"
            exit 1
          fi
          python3 scripts/release/update-manifest.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$REPO" \
            --assets assets \
            --notes-file notes.md \
            --output assets/update.json
          if [ -n "${UPDATE_SIGNING_KEY:-}" ]; then
            keyfile="$(mktemp)"
            sigfile="$(mktemp)"
            printf '%s\n' "$UPDATE_SIGNING_KEY" >"$keyfile"
            openssl pkeyutl -sign -rawin -inkey "$keyfile" -in assets/update.json -out "$sigfile"
            base64 <"$sigfile" >assets/update.json.sig
            rm -f "$keyfile" "$sigfile"
            python3 - <<'PY_SIG'
import base64
from pathlib import Path
sig = base64.b64decode(Path("assets/update.json.sig").read_text(), validate=True)
if len(sig) != 64:
    raise SystemExit(f"update.json.sig is not a raw Ed25519 signature: {len(sig)} bytes")
PY_SIG
            echo "update.json signed with UPDATE_SIGNING_KEY (base64 Ed25519)"
          else
            echo "::warning::UPDATE_SIGNING_KEY is not configured; update.json has no Ed25519 signature"
          fi
          (
            cd assets
            find . -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name 'update.json' -o -name 'update.json.sig' \) \
              -printf '%P\n' | sort | xargs sha256sum >SHA256SUMS
            cat SHA256SUMS
            n=$(wc -l <SHA256SUMS)
            if [ "$n" -lt 15 ]; then
              echo "::error::应有至少 15 个文件（14 个产物 + update.json），实际 $n 个"
              exit 1
            fi
          )

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "LLM Protocol Gateway $TAG" --notes-file notes.md
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --verify-tag \
              --title "LLM Protocol Gateway $TAG" \
              --notes-file notes.md
          fi
          gh release view "$TAG" --json assets -q '.assets | length' | xargs -I{} echo "Release $TAG 共 {} 个文件"
